<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event propagation</title>
</head>
<body>
    <h3>Event bubbling</h3>
    <div id="parent">
        <button id="child">click</button>
    </div>
    <h3>Event Capturing</h3>
    <div id="parent1">
        <button id="child1">click</button>
    </div>
    <h3>Event Delegation</h3>
    <div id="parent2">
        <button>BTN1</button>
        <button>BTN2</button>
        <button>BTN3</button>
    </div>
    <script src="./Event Bubbling.js"></script>
    <script src="./Event capturing.js"></script>
    <script src="./Event Delegation.js"></script>
</body>
</html>
