<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Mangment</title>
</head>
<body>
    <h1>Employee & Task Management</h1>
    <h2>Add Employee</h2>
    <input type="text" id="empName" placeholder="Employee Name">
    <button id="addEmployee">Add Employee</button>

    <h2>Employee List</h2>
    <input type="text" id="search" placeholder="Search Employee">
    <ul id="employeeList"></ul>

    <h2>Add Task</h2>
    <input type="text" id="taskName" placeholder="Task Name">
    <button id="addTask">Add Task</button>

    <h2>Task List</h2>
    <ul id="taskList"></ul>
    <script src="./Employees.js"></script>
</body>
</html>
