<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>User Management App</h1>
        <!-- Add User -->
        <form id="userForm">
            <input
                type="text"
                id="name"
                placeholder="Enter name"
                required
            >
            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >
            <button type="submit">
                Add User
            </button>
        </form>
        <hr>
        <!-- Search -->
        <input
            type="text"
            id="search"
            placeholder="Search user..."
        >
        <br><br>
        <button id="loadUsers">
            Load Users From API
        </button>
        <button id="clearUsers">
            Clear All Users
        </button>
        <p id="message"></p>
        <h2>Users</h2>
        <div id="userList"></div>
    </div>
    <script src="./load data.js"></script>
</body>
</html>
</body>
</html>
