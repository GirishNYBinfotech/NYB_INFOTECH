<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Event Listeners</h1>
    <!-- Click -->
    <button id="clickBtn">Click Me</button>
    <!-- Double Click -->
    <button id="dblClickBtn">Double Click Me</button>
    <br><br>
    <!-- Mouse Events -->
    <div id="mouseBox">
        Mouse Events
    </div>
    <br>
    <!-- Keyboard Events -->
    <input id="keyInput" type="text" placeholder="Type something">
    <br><br>
    <!-- Input Event -->
    <input id="nameInput" type="text" placeholder="Enter your name">
    <p id="output"></p>
    <!-- Change Event -->
    <select id="course">
        <option value="">Select Course</option>
        <option value="JavaScript">JavaScript</option>
        <option value="React">React</option>
        <option value="Python">Python</option>
    </select>
    <p id="courseOutput"></p>
    <br>
    <!-- Focus and Blur -->
    <input id="focusInput" type="text" placeholder="Focus on me">
    <br><br>
    <!-- Form Submit -->
    <form id="myForm">
        <input id="email" type="email" placeholder="Enter email">
        <button type="submit">Submit</button>
    </form>
    <script src="./Eventlistners.js"></script>
</body>
</html>
