<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Managment</title>
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        <form id="taskForm">
            <input
            type="text"
            id="taskInput"
            placeholder="Enter task name"
        >
        <button type="submit" id="submitBtn">Add Task</button>
        </form>

        <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
        >

        <select id="filterInput">
            <option value="all">All Tasks</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
        </select>

        <p id="message"></p>
        <ul id="taskList"></ul>
    </div>

    <script src="./Taskmanagment.js"></script>
</body>
</html>
