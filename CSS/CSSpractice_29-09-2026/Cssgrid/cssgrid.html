<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid</title>
    <link rel="stylesheet" href="cssgrid.css">
    <style>
         /*GRID CONTAINER*/
        .container {
            display: grid;
            /* 3 columns */
            grid-template-columns: 1fr 2fr 1fr;
            /* 3 rows */
            grid-template-rows: 80px 300px 80px;
            gap: 10px;

            /*GRID AREAS*/
            grid-template-areas:
                "header header header"
                "sidebar main right"
                "footer footer footer";
        }


        /*COMMON STYLING*/
        .container > div {
            padding: 20px;
            border: 2px solid black;
            background-color: rgb(15, 148, 192);
        }


        /* GRID AREA */
        .header {
            grid-area: header;
            background-color: lightcoral !important;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightgreen !important;
        }

        .main {
            grid-area: main;
            background-color: lightyellow !important;
        }

        .right {
            grid-area: right;
            background-color: lightpink !important;
        }

        .footer {
            grid-area: footer;
            background-color: lightgray !important;
        }


        /* NESTED GRID*/
        .nested-grid {
            display: grid;
            /* repeat() */
            grid-template-columns: repeat(3, 1fr);
            /* minmax() */
            grid-template-rows: minmax(50px, 100px);
            gap: 10px;
            margin-top: 20px;
        }

        .nested-grid div {
            border: 2px solid blue;
            padding: 15px;
            background-color: rgba(28, 138, 96, 0.993);
        }

        /* GRID ITEM PLACEMEN*/
        .item1 {
            grid-column: 1/3;
        }

        .item2 {
            grid-row: 1;
        }
    </style>
</head>
<body>
    <h1>CSS Grid </h1>
    <div class="container">
        <!-- Header -->
        <div class="header">
            Header
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            Sidebar
        </div>

        <!-- Main -->
        <div class="main">
            Main Content
            <!-- NESTED GRID -->
            <div class="nested-grid">
                <div class="item1">
                    Nested Item 1
                </div>
                <div class="item2">
                    Nested Item 2
                </div>
                <div>
                    Nested Item 3
                </div>
            </div>
        </div>
        <!-- Right -->
        <div class="right">
            Right Content
        </div>
        <!-- Footer -->
        <div class="footer">
            Footer
        </div>
    </div>
    <br><br>

    <h2>grid item placement</h2>
    <div class="container1">
    <div class="item item1">Item 1</div>
    <div class="item item2">Item 2</div>
    <div class="item item3">Item 3</div>
    <div class="item item4">Item 4</div>
    <div class="item item5">Item 5</div>
  </div>
</body>
</html>
