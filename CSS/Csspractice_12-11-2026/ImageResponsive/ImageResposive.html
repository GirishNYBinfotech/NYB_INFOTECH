<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageResponsive</title>
    <style>
        img{
            height: auto;
            width: 80%;
        }
        @media(min-width:600px){
            img{
                width: 60%;
            }
        }
        @media(min-width:1024px){
            img{
                width: 70%;
            }
        }
    </style>
</head>
<body>
    <img src="../../../HTML/image.png" alt="image">
</body>
</html>
