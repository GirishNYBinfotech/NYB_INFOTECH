<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of css</title>
    <link rel="stylesheet" href="Types of css.css">
    <style>
        *{
            color: crimson;
        }
        #internal{
            color:rgb(186, 199, 6)
        }
        #pp{
            color: chartreuse;
            background-color: brown;
        }
    </style>
</head>
<body>
    <!-- inline css -->
     <h2 style="background-color: aqua;color: brown;">Inline Css</h2>
     <p style="color: violet; font-size: medium;font-weight: bold;color: rgb(76, 9, 233);">This isinline css</p>
     <!-- internal css -->
      <h3 >internal css</h3>
      <p id="internal">This the internal css</p>
      <!-- External css -->
       <h3 >External css</h3>
       <p id="External">This is External css</p>
    <h3>Priority</h3>
    <p id="pp" style="color: brown;background-color: aqua;">This shows which type applys</p>
</body>
</html>
