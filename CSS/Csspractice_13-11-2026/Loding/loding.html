<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loding</title>
    <style>
        .loader {
        width: 50px;
        height: 50px;
        border: 5px solid #ddd;
        border-top: 5px solid blue;
        border-radius: 50%;
        animation: spin 2s linear infinite;
        }
        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
        }

        /* Dots loding */
        .dots {
            display: flex;
            gap: 8px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            background: blue;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-12px);
            }
        }
        /* process Bar */
        .progress {
            width: 300px;
            height: 15px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0;
            height: 100%;
            background: blue;
            animation: loading 10s linear forwards;
        }
        @keyframes loading {
            to {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h2>Loding spinner</h2>
    <div class="loader"></div>

    <h2>Dots loding</h2>
    <div class="dots">
        typing<span></span>
        <span></span>
        <span></span>
    </div>

    <h2>Progress Bar</h2>
    <div class="progress">
        <div class="progress-fill"></div>
    </div>
</body>
</html>
