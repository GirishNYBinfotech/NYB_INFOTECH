<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css components</title>
    <link rel="stylesheet" href="./csscomponnents.css">
</head>
<body>
    <h1>Interactive Components</h1>
    <!-- BUTTON -->
    <h2> Buttons</h2>
    <button class="btn">Click Me</button>

    <!-- DROPDOWN -->
    <h2> Dropdown</h2>
    <div class="dropdown">
        <button class="btn">Select Menu ▼</button>
        <div class="dropdown-content">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- TOOLTIP -->
    <h2> Tooltip</h2>
    <div class="tooltip">
        Hover Over Me
        <span class="tooltip-text">
            This is a tooltip
        </span>
    </div>

    <!-- CARDS -->
    <h2> Cards</h2>
    <div class="container">
        <div class="card">
            <h3>HTML</h3>
            <p>Learn HTML fundamentals.</p>
            <button>Explore</button>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Learn CSS styling.</p>
            <button>Explore</button>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Learn JavaScript basics.</p>
            <button>Explore</button>
        </div>
    </div>
</body>
</html>
