<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <link rel="stylesheet" href="Design.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h2>My Website</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Responsive Design</h1>
                <p>This page automatically adjusts according to screen size.</p>
            </div>

            <!-- Responsive Image -->
            <div class="hero-image">
                <img src="https://picsum.photos/600/400" alt="Responsive Image">
            </div>
        </section>


        <!-- Horizontal Alignment -->
        <section class="horizontal">
            <h2>Horizontal Alignment</h2>
            <p>This text is horizontally centered.</p>
        </section>


        <!-- Vertical Alignment -->
        <section class="vertical">
            <h2>Vertical Alignment</h2>
        </section>


        <!-- Grid Alignment -->
        <section class="cards">
            <div class="card">
                <h2>Card 1</h2>
                <p>Grid Alignment</p>
            </div>

            <div class="card">
                <h2>Card 2</h2>
                <p>Grid Alignment</p>
            </div>

            <div class="card">
                <h2>Card 3</h2>
                <p>Grid Alignment</p>
            </div>
        </section>

        <!-- Flex Alignment -->
        <div class="button-container">
            <button>Click Me</button>
        </div>

    </main>
</body>
</html>
