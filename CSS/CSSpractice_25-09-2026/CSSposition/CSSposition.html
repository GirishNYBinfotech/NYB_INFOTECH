<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css postion</title>
    <link rel="stylesheet" href="cssposition.css">
    <style>
        .container1 {
            position: relative;
            width: 400px;
            height: 300px;
            border: 3px solid black;
        }

        .box1 {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 150px;
            height: 150px;
            background-color: red;
            z-index: 1;
        }

        .box2 {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 150px;
            height: 150px;
            background-color: blue;
            z-index: 2;
        }

        .box3 {
            position: absolute;
            top: 150px;
            left: 150px;
            width: 150px;
            height: 100px;
            background-color: green;
            z-index: 3;
        }
        
        /* float and clear */
        .box {
            width: 100px;
            height: 100px;
            background-color: orange;
            float: left;
            /* float: right; */
            /* float: none; */
            margin-right: 20px;
        }

        .text {
            clear: left;
            /* clear: right; */
            /* clear:none; */
        }
    </style>
</head>
<body>
    <h1>Css postioing</h1>
    <div class="container">
        <div class="static">
            Static
        </div>
        <div class="relative">
            Relative
        </div>
        <div class="absolute">
            Absolute
        </div>
        <div class="sticky">
            Sticky
        </div>
        <div class="content">
            Scroll down to see Sticky behavior.
        </div>
    </div>
    <div class="fixed">
        Fixed
    </div>

    <h2>Z-Index, Stacking Order & Positioning Context</h2>
    <div class="container1">
        <div class="box1">
            Red Box<br> z-index: 1
        </div>
        <div class="box2">
            Blue Box<br> z-index: 2
        </div>
        <div class="box3">
            Green Box<br> z-index: 3
        </div>
    </div>

    <!-- float and clear -->
     <div class="box"></div>
    <p>
        This is float comes beside the box
    </p>

    <p class="text">
        This is clear comes after the box
    </p>
</body>
</html>
