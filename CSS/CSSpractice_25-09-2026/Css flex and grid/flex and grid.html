<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex and grid</title>
    <link rel="stylesheet" href="flex and grid.css">
    <style>
         /* 1. GRID CONTAINER */
        .container1{
            display: grid;
            /*  GRID COLUMNS */
            grid-template-columns: repeat(2, minmax(200px, 1fr));

            /*  GRID ROWS */
            grid-template-rows: 80px 150px 20px;

            /*  GAP */
            gap: 10px;

            /*  GRID AREAS */
            grid-template-areas:
                "header header header"
                "sidebar main main"
                "footer footer footer";
        }

        .header {
            background-color: lightblue;
            grid-area: header;
        }

        .sidebar {
            background-color: lightgreen;
            grid-area: sidebar;
        }

        .main {
            background-color: lightcoral;
            grid-area: main;
        }

        .footer {
            background-color: rgb(87, 87, 65);
            grid-area: footer;
        }

        .same{
            padding: 20px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h2>Flexbox</h2>
    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box">Box 5</div>
        <div class="box">Box 6</div>
    </div>
    <h2>CSS Grid</h2>
    <div class="container1" class="same" >
        <div class="header" class="same">
            Header
        </div>
        <div class="sidebar" class="same">
            Sidebar
        </div>
        <div class="main" class="same">
            Main Content
        </div>
        <div class="footer" class="same">
            Footer
        </div>
    </div>
</body>
</html>
