<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css positioning</title>
    <link rel="stylesheet" href="Positioning.css">
</head>
<body>
    <h1>CSS Positioning</h1>
    <h2>Static Position</h2>
    <div class="container">
        <div class="static">
            Static Position
        </div>
    </div>

    <h2>Relative Position</h2>
    <div class="container">
        <div class="relative">
            Relative Position
        </div>
    </div>

    <h2>Absolute Position</h2>
    <div class="container absolute-container">
        <div class="absolute">
            Absolute Position
        </div>
    </div>

    <h2>Sticky Position</h2>
    <div class="sticky">
        Sticky Position - Scroll Down
    </div>

    <div class="content">
        <h2>Scroll Content</h2>
        <p>Scroll the page to see the sticky and fixed positions.</p>
    </div>
    <div class="fixed">
        Fixed Position
    </div>
</body>
</html>
