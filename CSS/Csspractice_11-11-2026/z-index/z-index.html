<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <link rel="stylesheet" href="z-index.css">
    <style>
        .box {
            width: 200px;
            height: 150px;
            position: absolute;
        }

        .box1 {
            background-color: red;
            top: 50px;
            left: 50px;
            font-weight: bold;
            z-index: 1;
        }

        .box2 {
            background-color: blue;
            font-weight: bold;
            top: 100px;
            left: 100px;
            z-index: 2;
        }

        .box3 {
            background-color: green;
            font-weight: bold;
            top: 150px;
            left: 150px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <h2>CSS Z-Index</h2>
    <div class="box box1"> (z-index: 1)</div>
    <div class="box box2"> (z-index: 2)</div>
    <div class="box box3"> (z-index: 3)</div>
</body>
</html>
