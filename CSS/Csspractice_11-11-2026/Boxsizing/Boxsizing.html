<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxsizing</title>
    <style>
        .box {
      width: 300px;
      height: 150px;
      padding: 20px;
      border: 5px solid blue;
      margin: 30px;
      background-color: lightblue
    }

    .box2 {
      width: 300px;
      height: 150px;
      padding: 20px;
      border: 5px solid red;
      margin: 30px;
      box-sizing: border-box;
      background-color: lightcoral
    }
    </style>
</head>
<body>
    <div class="box">
    Box 1: Default Box Sizing
  </div>
  <div class="box2">
    Box 2: Border Box
  </div>
</body>
</html>
