<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <link rel="stylesheet" href="Website.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <h2 class="logo">MyWebsite</h2>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>


    <!-- Hero Section -->
    <section class="hero" id="home">

        <div class="hero-content">
            <h1>Build Website</h1>
            <button class="hero-btn">Get Started</button>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72" alt="Modern workspace">
        </div>
    </section>


    <!-- Cards Section -->
    <section class="features" id="features">
        <h2>Our Features</h2>
        <div class="card-container">
            <div class="card">
                <img  src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Web development">
                <h3>Web Development</h3>
                <button>Learn More</button>
            </div>


            <div class="card">
                <img src="https://images.unsplash.com/photo-1559028012-481c04fa702d" alt="Design">
                <h3>Modern Design</h3>
                <button>Learn More</button>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4" alt="Team work">
                <h3>Team Work</h3>
                <button>Learn More</button>
            </div>
        </div>
    </section>


    <!-- Call To Action -->
    <section class="cta" id="contact">
        <h2>Ready to Start?</h2>
        <p>buildyour responsive website.</p>
        <button>Get Started</button>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>
</body>
</html>
