<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi media</title>
    <link rel="shortcut icon" href="../Images/india.png" type="image/x-icon">
</head>
<body>
    <h1>HTML Audio and Video</h1>
     <h2>Audio</h2>
    <audio controls autoplay loop muted>
        <source 
            src="https://www.w3schools.com/html/horse.mp3">
    </audio>
    <h2>Audio 2</h2>
    <audio controls loop muted>
        <source src="./3_seconds_sms.mp3">
    </audio>


    <!-- VIDEO -->
    <h2>Video1</h2>
    <video width="500" controls autoplay loop muted>
        <source 
            src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>
    <h2>Video2</h2>
    <video controls autoplay height="400" width="500">
        <source src="./vedio.mp4">
    </video>
</body>
</html>
