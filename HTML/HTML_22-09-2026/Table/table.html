<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2>Table1</h2>
    <table border="1"> 
    <caption>Details</caption>
        <tr> 
            <th>Name</th> 
            <th>Age</th> 
            <th>City</th> 
        </tr> 
        <tr> 
            <td>Girish</td> 
            <td>25</td> 
            <td>Vijayawada</td>
        </tr> 
        <tr> 
            <td>Rahul</td> 
            <td>24</td> 
            <td>Hyderabad</td> 
        </tr> 
        <tr> 
            <td>Priya</td> 
            <td>23</td> 
            <td>Chennai</td> 
        </tr> 
    </table>

    <h2>Table2</h2>
    <table border="3" cellpadding="10">
        <caption><b>Employee Details</b></caption>
        <tr>
            <th rowspan="2">ID</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Job Details</th>
            <th rowspan="2">Salary</th>
        </tr>
        <tr>
            <th>Department</th>
            <th>Position</th>
        </tr>
        <tr>
            <td>101</td>
            <td>King</td>
            <td>IT</td>
            <td>Developer</td>
            <td>50000</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Queen</td>
            <td>HR</td>
            <td>Manager</td>
            <td>60000</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Girish</td>
            <td>IT</td>
            <td>Tester</td>
            <td>45000</td>
        </tr>
        <tr>
            <td colspan="4"><b>Total Employees</b></td>
            <td><b>3</b></td>
        </tr>
    </table>
</body>
</html>
