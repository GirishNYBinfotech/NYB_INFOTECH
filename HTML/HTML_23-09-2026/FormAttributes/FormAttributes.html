<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes</title>
</head>
<body>
    <h1>Form attributes</h1>
    <form action="submit-form" method="post">
        <!-- name, placeholder, required -->
        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter your username" required>
        <br><br>

        <!-- value -->
        <label>Country:</label>
        <input type="text" name="country" value="India">
        <br><br>

        <!-- readonly -->
        <label>User ID:</label>
        <input type="text" name="userid" value="USER123" readonly>
        <br><br>

        <!-- disabled -->
        <label>Account Status:</label>
        <input type="text" name="status" value="Active" disabled>
        <br><br>

        <!-- min and max -->
        <label>Age:</label>
        <input type="number" name="age" min="18" max="60" placeholder="18 - 60">
        <br><br>

        <!-- maxlength -->
        <label>Mobile Number:</label>
        <input type="text" name="mobile" maxlength="10" placeholder="Enter 10 digit number">
        <br><br>

        <!-- pattern -->
        <label>PIN Code:</label>
        <input type="text" name="pincode" pattern="[0-9]{6}" placeholder="Enter 6 digit PIN" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
