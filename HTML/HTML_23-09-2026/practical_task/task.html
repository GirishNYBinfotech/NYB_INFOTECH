<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="enter your name" required>
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob">
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>
        </fieldset>
        <br>

        <fieldset>
            <legend>Contact Details</legend>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="enter email" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digit number" required>
            <br><br>
            <label for="address">Address:</label>
            <br>
            <textarea id="address"></textarea>
        </fieldset>
        <br>

        <fieldset>
            <legend>Education</legend>
            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">-- Select --</option>
                <option value="10th">10th</option>
                <option value="12th">12th</option>
                <option value="diploma">Diploma</option>
                <option value="btech">B.Tech</option>

            </select>

            <br><br>
            <label for="college">College / University:</label>
            <input type="text" id="college" name="college">
            <br><br>
            <label for="graduationYear">Graduation Year:</label>
            <input type="number" id="graduationYear" name="graduationYear" min="1950" max="2030">
        </fieldset>
        <br>

        <fieldset>
            <legend>Skills</legend>
            <label for="skills">Technical Skills:</label>
            <br>
            <textarea id="skills" placeholder="HTML, CSS, JavaScript, React" required></textarea>
        </fieldset>
        <br>

        <fieldset>
            <legend>Experience</legend>
            <label for="experience">Experience:</label>
            <select id="experience" name="experience" required>
                <option value="">-- Select Experience --</option>
                <option value="fresher">Fresher</option>
                <option value="0-1">0-1 Years</option>
                <option value="1-3">1-3 Years</option>
                <option value="5+">5+ Years</option>
            </select>

            <br><br>
            <label for="company">Previous Company:</label>
            <input type="text" id="company" name="company">
        </fieldset>
        <br>

        <fieldset>
            <legend>Location</legend>
            <label for="location">Preferred Location:</label>
            <select id="location" name="location" required>
                <option value="">Select Location</option>
                <option value="hyderabad">Hyderabad</option>
                <option value="bangalore">Bangalore</option>
                <option value="chennai">Chennai</option>
                <option value="remote">Remote</option>
            </select>
        </fieldset>
        <br>

        <fieldset>
            <legend>Resume Upload</legend>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>

        </fieldset>
        <br>

        <fieldset>
            <legend>Terms and Conditions</legend>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms and Conditions.</label>

        </fieldset>
        <br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
